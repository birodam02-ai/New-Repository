
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tasks - Vazifalar ro'yxati</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #ede9fe);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    h1 {
      color: #2563eb;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      text-align: center;
      margin-bottom: 25px;
    }

    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 12px 15px;
      font-size: 14px;
      transition: 0.2s;
    }

    .add-btn {
      background: #2563eb;
      color: white;
    }

    .add-btn:hover {
      background: #1d4ed8;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #666;
      font-size: 13px;
      margin-bottom: 15px;
    }

    #taskList {
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #eee;
    }

    .task input[type="checkbox"] {
      flex: none;
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #2563eb;
    }

    .task span {
      flex: 1;
      overflow-wrap: anywhere;
      color: #333;
    }

    .task.done span {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
      padding: 8px 10px;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .clear-btn {
      width: 100%;
      background: #f1f5f9;
      color: #475569;
      margin-top: 10px;
    }

    .clear-btn:hover {
      background: #e2e8f0;
    }

    #emptyMessage {
      text-align: center;
      color: #999;
      padding: 20px 0;
    }

    footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📝 My Tasks</h1>
    <p class="subtitle">Vazifalaringni tartibga sol!</p>

    <form class="input-box" id="taskForm">
      <input
        type="text"
        id="taskInput"
        placeholder="Yangi vazifa yoz..."
        maxlength="150"
        autocomplete="off"
      >
      <button class="add-btn" type="submit">+ Qo'shish</button>
    </form>

    <div class="stats">
      <span id="totalTasks">Jami: 0</span>
      <span id="completedTasks">Bajarildi: 0</span>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMessage">Hozircha vazifalar yo'q 😊</p>

    <button class="clear-btn" id="clearBtn">
      Bajarilganlarni tozalash
    </button>

    <footer>My Tasks © 2026 | Mening vazifalarim</footer>
  </div>

  <script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const totalTasks = document.getElementById("totalTasks");
    const completedTasks = document.getElementById("completedTasks");
    const emptyMessage = document.getElementById("emptyMessage");
    const clearBtn = document.getElementById("clearBtn");

    let tasks = [];

    try {
      tasks = JSON.parse(localStorage.getItem("myTasks")) || []d;
      if (!Array.isArray(tasks)) tasks = [];
    } catch {
      tasks = [];
    }

    function saveTasks() {
      try {
        localStorage.setItem("myTasks", JSON.stringify(tasks));
      } catch {
        alert("Vazifalarni saqlab bo'lmadi.");
      }
    }

    function renderTasks() {
      taskList.replaceChildren();

      tasks.forEach(function(task) {
        const li = document.createElement("li");
        li.className = "task" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Bajarildi");

        checkbox.addEventListener("change", function() {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const span = document.createElement("span");
        span.textContent = task.text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "O'chirish";

        deleteBtn.addEventListener("click", function() {
          tasks = tasks.filter(function(item) {
            return item.id !== task.id;
          });
          saveTasks();
          renderTasks();
        });

        li.append(checkbox, span, deleteBtn);
        taskList.appendChild(li);
      });

      const completed = tasks.filter(function(task) {
        return task.done;
      }).length;

      totalTasks.textContent = "Jami: " + tasks.length;
      completedTasks.textContent = "Bajarildi: " + completed;
      emptyMessage.hidden = tasks.length > 0;
      clearBtn.hidden = completed === 0;
    }

    taskForm.addEventListener("submit", function(event) {
      event.preventDefault();

      const text = taskInput.value.trim();

      if (text === "") {
        taskInput.focus();
        return;
      }

      tasks.push({
        id: Date.now() + Math.random(),
        text: text,
        done: false
      });

      saveTasks();
      renderTasks();

      taskInput.value = "";
      taskInput.focus();
    });

    clearBtn.addEventListener("click", function() {
      tasks = tasks.filter(function(task) {
        return !task.done;
      });

      saveTasks();
      renderTasks();
    });

    renderTasks();
  </script>
</body>
</html>
